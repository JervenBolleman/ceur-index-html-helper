# Builds the browser (WebAssembly) version of make-index and publishes it on GitHub Pages.
# Every push is built, only main is deployed.
name: Browser version on GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # sjh is not published to Maven Central
  SJH_COMMIT: d0ff6294d1fe4bca3351539a8a6c86819ba38029
  BINARYEN_VERSION: '126'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Oracle GraalVM (includes the svm-wasm Web Image tool)
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.4'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Install binaryen (wasm-opt)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build and install sjh
        run: |
          git clone --quiet https://github.com/JervenBolleman/sjh.git "$RUNNER_TEMP/sjh"
          git -C "$RUNNER_TEMP/sjh" checkout --quiet "$SJH_COMMIT"
          mvn -B -q -f "$RUNNER_TEMP/sjh/pom.xml" install -DskipTests -Dgpg.skip

      - name: Build the WebAssembly version
        run: |
          # use the Web Image API matching the installed GraalVM
          GRAALVM_VERSION=$(sed -n 's/^GRAALVM_VERSION="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          echo "GraalVM $GRAALVM_VERSION"
          native-image --version
          wasm-opt --version
          mvn -B -Pwasm package -Dgraalvm.version="$GRAALVM_VERSION" -Dnative-image="$JAVA_HOME/bin/native-image"
          ls -l target/web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
